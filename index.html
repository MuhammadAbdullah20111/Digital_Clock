<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Digital Clock</title>
    <meta name="description" content="A stunning 3D digital clock with glassmorphism design, neon glow effects, and animated particles.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>

    <div class="clock-container">
        <div class="greeting" id="greeting">Good Evening</div>

        <div class="clock">
            <div class="clock-inner">
                <div class="time" id="time">
                    <div class="digit-group">
                        <span class="digit hours" id="hours-display">00</span>
                        <span class="label">HOURS</span>
                    </div>
                    <span class="separator">
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </span>
                    <div class="digit-group">
                        <span class="digit minutes" id="minutes-display">00</span>
                        <span class="label">MINUTES</span>
                    </div>
                    <span class="separator">
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </span>
                    <div class="digit-group">
                        <span class="digit seconds" id="seconds-display">00</span>
                        <span class="label">SECONDS</span>
                    </div>
                    <div class="ampm-badge" id="ampm">PM</div>
                </div>
            </div>

            <div class="date-bar">
                <span class="date-icon">📅</span>
                <span class="date-text" id="date"></span>
            </div>

            <div class="progress-ring-container">
                <svg class="progress-ring" viewBox="0 0 120 120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="54" />
                    <circle class="progress-ring-fill" id="seconds-ring" cx="60" cy="60" r="54" />
                </svg>
                <span class="progress-label">SEC</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
